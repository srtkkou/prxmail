version: '3'

includes:
  build: ./Taskfile_{{OS}}.yml

tasks:
  default:
    cmds:
      - task: test

  test:
    deps: [staticcheck]
    cmds:
      - go test -cover ./...

  test-v:
    deps: [staticcheck]
    cmds:
      - go test -cover -race -v ./...

  fmt:
    cmds:
      - go fmt ./...

  vet:
    deps: [fmt]
    cmds:
      - go vet ./...

  fix:
    deps: [vet]
    cmds:
      - go fix ./...

  staticcheck:
    deps: [fix]
    cmds:
      - go tool staticcheck ./...

  build:
    deps: [staticcheck]
    cmds:
      - go build -ldflags "-X main.Revision={{.COMMIT_HASH}}" -o prxmail.exe cmd/prxmail/main.go
    env:
      CGO_ENABLED: 0
    vars:
      COMMIT_HASH:
        sh: git rev-parse HEAD
    sources:
      - go.mod
      - go.sum
      - "**/*.go"
    generates:
      - prxmail.exe

  clean:
    cmds:
      - rm -f prxmail.exe
